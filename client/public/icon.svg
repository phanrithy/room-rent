<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Building & Home Silhouette -->
  <g filter="url(#glow)" transform="translate(106, 100)">
    <!-- Main Highrise Tower -->
    <path d="M70 120 L70 300 L230 300 L230 120 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Angled Modern Roof -->
    <polygon points="50,120 150,40 250,120" fill="#ffffff"/>
    
    <!-- Sun / Key Accent (Sunrise over building) -->
    <circle cx="150" cy="40" r="22" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="4"/>

    <!-- Left Wing Tower -->
    <rect x="20" y="160" width="50" height="140" fill="#e2e8f0"/>
    
    <!-- Windows Grid -->
    <g fill="#2563eb">
      <!-- Main tower windows -->
      <rect x="95" y="145" width="22" height="26" rx="4"/>
      <rect x="139" y="145" width="22" height="26" rx="4"/>
      <rect x="183" y="145" width="22" height="26" rx="4"/>

      <rect x="95" y="195" width="22" height="26" rx="4"/>
      <rect x="139" y="195" width="22" height="26" rx="4"/>
      <rect x="183" y="195" width="22" height="26" rx="4"/>

      <!-- Main Entrance Door -->
      <path d="M135 250 H165 V300 H135 Z" fill="#1e293b"/>
      <!-- Window panes on left wing -->
      <rect x="35" y="180" width="18" height="20" rx="3" fill="#64748b"/>
      <rect x="35" y="220" width="18" height="20" rx="3" fill="#64748b"/>
    </g>
  </g>
</svg>